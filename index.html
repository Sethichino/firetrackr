<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Firetrackr CRM & Municipal Deficiency Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --navy: #0f172a;
      --slate: #1e293b;
      --blue: #2563eb;
      --red: #dc2626;
      --amber: #d97706;
      --green: #16a34a;
      --purple: #7c3aed;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Control Header */
    header {
      background: var(--navy);
      color: #fff;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span.badge {
      background: var(--red);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
    }
    .btn-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      background: var(--blue);
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.92; }
    .btn.green { background: var(--green); }
    .btn.amber { background: var(--amber); }
    .btn.purple { background: var(--purple); }
    .btn.danger { background: var(--red); }
    .btn.slate { background: #334155; }

    /* Search & Filter Bar */
    .search-filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 170px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 0.82rem;
    }
    .search-input::placeholder { color: #94a3b8; }
    .radius-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .toggle-bar {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .toggle-pill {
      border: 1px solid #475569;
      background: #1e293b;
      color: #cbd5e1;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .toggle-pill.active-alarm { background: var(--red); border-color: #f87171; color: #fff; }
    .toggle-pill.active-insp { background: #ea580c; border-color: #fdba74; color: #fff; }
    .toggle-pill.active-defic { background: var(--blue); border-color: #93c5fd; color: #fff; }
    .toggle-pill.active-rytag { background: #b91c1c; border-color: #fde047; color: #fef08a; box-shadow: 0 0 0 2px rgba(250,204,21,0.35); }

    /* Split Map + Closest Leads List */
    #main-split {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    #map-container {
      flex: 1.15;
      position: relative;
      min-height: 220px;
    }
    #map { width: 100%; height: 100%; }
    .gps-fab {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 900;
      background: #fff;
      color: var(--navy);
      border: 2px solid var(--navy);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .map-status-banner {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 900;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      pointer-events: none;
    }

    /* Closest Leads List Panel Below Map */
    #list-panel {
      flex: 0.85;
      background: #fff;
      border-top: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .list-header {
      background: #f8fafc;
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--slate);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #closest-list {
      flex: 1;
      overflow-y: auto;
      divide-y: 1px solid var(--border);
    }
    .lead-row {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .lead-row:hover { background: #f1f5f9; }
    .lead-row-left { flex: 1; min-width: 0; }
    .lead-row-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .lead-row-sub {
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .lead-row-right {
      text-align: right;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .dist-pill {
      background: #e2e8f0;
      color: var(--navy);
      font-weight: 800;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .tag-chip {
      font-size: 0.66rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .tag-chip.red { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .tag-chip.yellow { background: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
    .tag-chip.hist { background: #f3e8ff; color: #6b21a8; border: 1px solid #c084fc; }

    /* Custom Map Marker DivIcons */
    .pin-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      border: 2px solid #fff;
    }
    .pin-redtag { background: #dc2626; color: #fff; border-color: #fef08a; }
    .pin-yellowtag { background: #f59e0b; color: #fff; border-color: #78350f; }
    .pin-alarm { background: #ef4444; color: #fff; }
    .pin-insp { background: #ea580c; color: #fff; }
    .pin-defic { background: #2563eb; color: #fff; }
    .pin-visited { background: #16a34a; color: #fff; }
    .pin-default { background: #334155; color: #fff; }

    /* Slide-Up Property Card Drawer */
    #record-drawer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    #record-drawer.open { display: flex; }
    .drawer-sheet {
      background: #fff;
      width: 100%;
      max-width: 680px;
      max-height: 92vh;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }
    .drawer-nav {
      background: var(--navy);
      color: #fff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .dir-group {
      display: flex;
      gap: 4px;
    }
    .dir-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
    }
    .dir-btn:hover { background: var(--blue); }
    .close-drawer-btn {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .drawer-body {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prop-header h2 { font-size: 1.15rem; color: var(--navy); }
    .prop-addr { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .contact-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.82rem;
    }
    .contact-card .full { grid-column: 1 / -1; }
    .quick-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick-actions a, .quick-actions button {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      color: #fff;
      background: var(--blue);
      border: none;
      cursor: pointer;
    }

    /* Municipal Deficiency & Historical Tag Box */
    .deficiency-audit-box {
      border-radius: 10px;
      padding: 11px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
    }
    .deficiency-audit-box.red-box {
      background: #fef2f2;
      border-color: #dc2626;
    }
    .deficiency-audit-box.yellow-box {
      background: #fffbeb;
      border-color: #d97706;
    }
    .deficiency-audit-box.hist-box {
      background: #faf5ff;
      border-color: #9333ea;
    }
    .audit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .audit-title {
      font-weight: 800;
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .audit-meta {
      font-size: 0.76rem;
      color: #334155;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .audit-log-scroll {
      max-height: 165px;
      overflow-y: auto;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.76rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    /* Survey Section */
    .section-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    .section-box h3 {
      font-size: 0.88rem;
      color: var(--navy);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .form-field { display: flex; flex-direction: column; gap: 3px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 0.72rem; font-weight: 700; color: var(--muted); }
    .form-field input, .form-field select, .form-field textarea {
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .bldg-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="brand">
      🔥 Firetrackr <span class="badge" id="lead-count-badge">0 Leads</span>
    </div>
    <div class="btn-group">
      <label class="btn" title="Upload Master_Firetrackr_Leads.csv">
        📂 Import Leads
        <input type="file" id="csv-file-input" accept=".csv" style="display:none" />
      </label>
      <button class="btn green" id="btn-export-master" style="display:none" onclick="exportUpdatedMasterCSV()">
        💾 Export Updated Master CSV
      </button>
      <button class="btn amber" id="btn-export-screener" style="display:none" onclick="exportUnmatchedScreenerCSV()">
        📋 Export Unmatched Screener CSV (<span id="unmatched-count">0</span>)
      </button>
      <button class="btn purple" onclick="loadPortalStandalone()">
        🏛️ View All 453 Portal Sites
      </button>
      <button class="btn danger" onclick="clearAllData()">🗑️ Reset</button>
    </div>
  </div>

  <div class="search-filter-row">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Search Contact, Property Name, Street, or Deficiency..." oninput="applyFilters()" />
    <div class="radius-box">
      <span>📍 Radius:</span>
      <input type="range" id="radius-slider" min="1" max="60" value="50" oninput="updateRadiusLabel()" onchange="applyFilters()" style="width:75px" />
      <span id="radius-label">50 mi</span>
    </div>
  </div>

  <div class="toggle-bar">
    <div class="toggle-pill" id="toggle-rytag" onclick="toggleFilter('rytag')">
      🏷️ Red/Yellow Tags (<span id="cnt-rytag">0</span>)
    </div>
    <div class="toggle-pill" id="toggle-alarm" onclick="toggleFilter('alarm')">
      🚒 Alarms 30d (<span id="cnt-alarm">0</span>)
    </div>
    <div class="toggle-pill" id="toggle-insp" onclick="toggleFilter('insp')">
      🔥 Insp Due 60d (<span id="cnt-insp">0</span>)
    </div>
    <div class="toggle-pill" id="toggle-defic" onclick="toggleFilter('defic')">
      🔧 Post-Insp 45d (<span id="cnt-defic">0</span>)
    </div>
  </div>
</header>

<div id="main-split">
  <div id="map-container">
    <div id="map"></div>
    <button class="gps-fab" onclick="centerOnUserGPS()" title="Center Map on My Live GPS Location">🎯</button>
    <div class="map-status-banner" id="map-status-banner">
      Ready — Import your Master_Firetrackr_Leads.csv to auto-match Wilco, LTFR & Hutto inspection dates and Red/Yellow tags.
    </div>
  </div>

  <div id="list-panel">
    <div class="list-header">
      <span id="list-header-title">📍 Closest Leads to Your Location</span>
      <span id="list-showing-count">0 shown</span>
    </div>
    <div id="closest-list"></div>
  </div>
</div>

<!-- Property Record Card Modal / Drawer -->
<div id="record-drawer">
  <div class="drawer-sheet">
    <div class="drawer-nav">
      <div class="dir-group">
        <button class="dir-btn" onclick="navigateCardinal('N')" title="Nearest Lead North">⬆️ N</button>
        <button class="dir-btn" onclick="navigateCardinal('S')" title="Nearest Lead South">⬇️ S</button>
        <button class="dir-btn" onclick="navigateCardinal('W')" title="Nearest Lead West">⬅️ W</button>
        <button class="dir-btn" onclick="navigateCardinal('E')" title="Nearest Lead East">➡️ E</button>
      </div>
      <button class="close-drawer-btn" onclick="closeDrawer()">✕ Close</button>
    </div>

    <div class="drawer-body" id="drawer-body-content"></div>
  </div>
</div>

<script>

// 2. ADDRESS NORMALIZATION ENGINE (Matches CRM Addresses to Municipal Portals)
// ============================================================================
function normalizeStreet(addr) {
  if (!addr) return "";
  let s = String(addr).toLowerCase().replace(/\r?\n/g, " ");
  s = s.replace(/,\s*(austin|cedar park|leander|georgetown|round rock|pflugerville|lakeway|bee cave|manor|buda|kyle|san marcos|hutto|taylor|dripping springs|west lake hills|sunset valley|rollingwood|del valle|spicewood|bastrop|elgin|wimberley|new braunfels)\b.*$/i, " ");
  s = s.replace(/\b(suite|ste|apt|apartment|unit|bldg|building|rm|room|floor|fl|spc|space|lot|trlr|slip|pad)\b\.?\s*[\w\d#-]*/gi, " ");
  s = s.replace(/#\s*[\w\d-]+/g, " ");
  s = s.replace(/\b(austin|cedar park|leander|georgetown|round rock|pflugerville|lakeway|bee cave|manor|buda|kyle|san marcos|hutto|taylor|dripping springs|west lake hills|sunset valley|rollingwood|del valle|spicewood|bastrop|elgin|wimberley|new braunfels|tx|texas)\b/gi, " ");
  s = s.replace(/\b7[5-9]\d{3}(?:-\d{4})?\b/g, " ");
  s = s.replace(/\bu\.?\s*s\.?\s*(?:hwy|hy|highway)?\s*290\b|\bhwy\s*290\b|\bhy\s*290\b|\bhighway\s*290\b/gi, "290");
  s = s.replace(/\bu\.?\s*s\.?\s*(?:hwy|hy|highway)?\s*183\b|\bhwy\s*183\b|\bhy\s*183\b|\bhighway\s*183\b|\bresearch\s+blvd\b/gi, "183");
  s = s.replace(/\bu\.?\s*s\.?\s*(?:hwy|hy|highway)?\s*79\b|\bhwy\s*79\b|\bhy\s*79\b|\bhighway\s*79\b|\bus\s*79\b/gi, "79");
  s = s.replace(/\bi\.?\s*h\.?\s*35\b|\bi-?35\b|\binterstate\s*(?:hwy\s*)?35\b/gi, "35");
  s = s.replace(/\bn\s+capital\s+of\s+texas\b|\bs\s+capital\s+of\s+texas\b|\bcapital\s+of\s+texas\b|\bloop\s*360\b/gi, "360");
  s = s.replace(/\bmopac\b|\bloop\s*1\b/gi, "mopac");
  s = s.replace(/\bben\s+white\b|\bhwy\s*71\b|\bsh\s*71\b|\bhy\s*71\b/gi, "71");
  s = s.replace(/\bfarm\s+to\s+market\s*(?:rd|road)?\b|\bf\.?\s*m\.?\s*(?:rd|road)?\b|\branch\s+to\s+market\s*(?:rd|road)?\b|\br\.?\s*m\.?\s*(?:rd|road)?\b|\brr\b/gi, "fm");
  s = s.replace(/\bmanchaca\b|\bmenchaca\b/gi, "manchaca");
  s = s.replace(/\b1st\b/gi, "1").replace(/\b2nd\b/gi, "2").replace(/\b3rd\b/gi, "3").replace(/\b(\d+)th\b/gi, "$1");
  s = s.replace(/[^a-z0-9\s]/g, " ");
  s = s.replace(/\b(st|street|ave|avenue|blvd|boulevard|rd|road|dr|drive|ln|lane|ct|court|pkwy|parkway|cir|circle|pl|place|trl|trail|way|cv|cove|loop|ter|terrace|expy|expressway|svrd|service|frontage|nb|sb|eb|wb|n|s|e|w|north|south|east|west|hwy|hy|highway|us|ih|sh|tx|blk|block)\b/gi, " ");
  return s.trim().replace(/\s+/g, " ");
}

function estimateCoords(street, cityZip) {
  let cStr = String(cityZip || "").toLowerCase();
  let base = [30.3900, -97.7500];
  for (const [k, coords] of Object.entries(CITY_COORDS)) {
    if (cStr.includes(k)) { base = coords; break; }
  }
  const s = String(street || "");
  let h1 = 0, h2 = 0;
  for (let i = 0; i < s.length; i++) {
    h1 = (h1 * 31 + s.charCodeAt(i)) % 10000;
    h2 = (h2 * 37 + s.charCodeAt(i)) % 10000;
  }
  const latOffset = ((h1 / 10000) - 0.5) * 0.075;
  const lngOffset = ((h2 / 10000) - 0.5) * 0.085;
  return [base[0] + latOffset, base[1] + lngOffset];
}

function updateUserMarker() {

  const icon = L.divIcon({

    iconAnchor: [8, 8]
  });
  userMarker = L.marker([userLat, userLng], { icon, zIndexOffset: 1000 }).addTo(map).bindPopup("📍 Your Location");
}

function centerOnUserGPS() {
  if (!navigator.geolocation) {
    map.setView([userLat, userLng], 13);
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    updateUserMarker();
    map.setView([userLat, userLng], 13);
    applyFilters();
  }, () => {
    map.setView([userLat, userLng], 13);
  }, { enableHighAccuracy: true });
}

function haversineMiles(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ============================================================================
// 4. ROLLING TIMELINE & DEFICIENCY EVALUATION ENGINE
// ============================================================================
function evaluateLeadFlags(lead) {
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // 1. Active Fire Alarm in last 30 days
  let hasAlarm30d = false;
  if (lead.alarmDate) {
    const ad = new Date(lead.alarmDate);
    if (!isNaN(ad)) {
      const diffDays = (todayMidnight - ad) / (1000 * 60 * 60 * 24);
      if (diffDays >= -1 && diffDays <= 30) hasAlarm30d = true;
    }
  }

  // 2. Normalized 1st of Month Rolling Inspection (60d prior) & Post-Inspection Wrench (45d after)
  let hasInsp60d = false;
  let hasDefic45d = false;
  if (lead.inspectionDate) {
    const idt = new Date(lead.inspectionDate);
    if (!isNaN(idt)) {
      const inspMonth = idt.getUTCMonth();
      for (let yrOffset = -1; yrOffset <= 1; yrOffset++) {
        const due1st = new Date(todayMidnight.getFullYear() + yrOffset, inspMonth, 1);
        const daysUntilDue = (due1st - todayMidnight) / (1000 * 60 * 60 * 24);
        if (daysUntilDue > 0 && daysUntilDue <= 60) hasInsp60d = true;
        const daysSinceDue = (todayMidnight - due1st) / (1000 * 60 * 60 * 24);
        if (daysSinceDue >= 0 && daysSinceDue <= 45) hasDefic45d = true;
      }
    }
  }

  // 3. Active Red or Yellow Tag Outstanding (from Municipal Portals or CSV columns)
  const hasActiveRed = Boolean(lead.activeRedTag);
  const hasActiveYellow = Boolean(lead.activeYellowTag);
  const hasActiveRYTag = hasActiveRed || hasActiveYellow;

  return { hasAlarm30d, hasInsp60d, hasDefic45d, hasActiveRed, hasActiveYellow, hasActiveRYTag };
}

// 5. CSV IMPORT + AUTOMATIC WILCO / LTFR / HUTTO COMPARISON & MERGE
// ============================================================================
function handleCSVUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data || [];
      let matchedPortalCount = 0;
      let updatedInspDatesCount = 0;
      const byNormStreet = {};

      rows.forEach((r, idx) => {
        const bName = (r["Business_Name"] || r["Topic"] || r["Property_Name"] || "Commercial Lead").trim();
        const street = (r["Street_Address"] || r["Address 1"] || r["Base_Street_Address"] || "").trim();
        const city = (r["City"] || "Austin").trim();
        const zip = String(r["ZIP/Postal Code"] || r["Zip"] || "").replace(/\.0$/, "").trim();
        const csz = (r["City, State, Zip"] || `${city}, TX ${zip}`).trim();
        const normSt = normalizeStreet(street);

        // Check if this row matches our embedded 453-location Wilco/LTFR/Hutto database
        const pMatch = normSt && PORTAL_DEFICIENCY_DB[normSt] ? PORTAL_DEFICIENCY_DB[normSt] : null;

        let inspDate = (r["Inspection_Date"] || r["Inspection Due Date"] || "").trim();
        let inspSource = (r["Inspection_Date_Source"] || "").trim();
        let latestPortalInsp = (r["Latest_Inspection_Date"] || "").trim();

        // Update Inspection Date on Master Import Lead when address matches a portal report with a date!
        if (pMatch) {
          matchedPortalCount++;
          if (pMatch.ftDate) {
            inspDate = pMatch.ftDate;
            latestPortalInsp = pMatch.lastInsp;
            inspSource = `Updated from ${pMatch.jur} (${pMatch.lastInsp})`;
            updatedInspDatesCount++;
          }
        }

        // Active & Historical Red/Yellow Tag Tracking
        const csvTagStatus = (r["Current_Tag_Status"] || r["Tag_Status"] || "").trim();
        const csvHistTag = (r["Historical_Tag_Record"] || "").trim();
        const csvDefDetails = (r["Historical_Deficiency_Log"] || r["Clean_Deficiency_Details"] || "").trim();

        const currentTagStatus = pMatch ? pMatch.tagStatus : csvTagStatus;
        const activeRedTag = pMatch ? pMatch.activeRed : /red tag/i.test(currentTagStatus);
        const activeYellowTag = pMatch ? pMatch.activeYellow : /yellow tag/i.test(currentTagStatus);

        let histTagRecord = csvHistTag;
        if (pMatch) {
          const pHist = pMatch.activeRed ? "Red Tag (Active/Historical)" : (pMatch.activeYellow ? "Yellow Tag (Active/Historical)" : pMatch.tagStatus);
          histTagRecord = histTagRecord ? `${histTagRecord} | ${pHist}` : pHist;
        } else if (!histTagRecord && currentTagStatus) {
          histTagRecord = currentTagStatus;
        }

        const deficiencyLog = pMatch ? pMatch.histLog : csvDefDetails;
        const deficiencyFoundDates = pMatch ? pMatch.foundDates : (r["Deficiency_Found_Dates"] || "").trim();
        const trackedSystems = pMatch ? pMatch.systems : (r["Tracked_Systems"] || "").trim();
        const jurisdiction = pMatch ? pMatch.jur : (r["Jurisdiction"] || "").trim();

        const coords = estimateCoords(street, csz);

        const leadObj = {
          id: "L_" + idx,
          rawRow: r,
          businessName: bName,
          street: street,
          city: city,
          zip: zip,
          cityStateZip: csz,
          normStreet: normSt,
          contactName: (r["Contact_Name"] || r[" Name"] || "").trim(),
          jobTitle: (r["Job Title"] || "").trim(),
          phone: (r["Phone"] || r["Business Phone"] || "").trim(),
          email: (r["Email"] || "").trim(),
          inspectionDate: inspDate,
          inspectionSource: inspSource,
          latestPortalInsp: latestPortalInsp,
          notes: (r["Notes"] || r["Latest_CRM_Note"] || "").trim(),
          alarmDate: (r["Alarm Date"] || "").trim(),
          alarmNotes: (r["Alarm Notes"] || "").trim(),
          allHistoricalAlarms: (r["All_Historical_Alarms"] || "").trim(),
          currentTagStatus: currentTagStatus,
          activeRedTag: activeRedTag,
          activeYellowTag: activeYellowTag,
          historicalTagRecord: histTagRecord,
          deficiencyFoundDates: deficiencyFoundDates,
          trackedSystems: trackedSystems,
          jurisdiction: jurisdiction,
          deficiencyLog: deficiencyLog,
          portalMatched: Boolean(pMatch),
          visited: false,
          lat: coords[0],
          lng: coords[1],
          surveys: [
            { name: "Building 1", panelMake: "", commType: "Unknown", extCount: 0, tagType: "None", notes: "", photos: [] }
          ]
        };

        // Upsert by normalized street + business name if multi-row alarm export
        const key = (normSt || bName.toLowerCase()) + "::" + bName.toLowerCase();
        if (byNormStreet[key]) {
          const ex = byNormStreet[key];
          if (leadObj.alarmDate && !ex.allHistoricalAlarms.includes(leadObj.alarmDate)) {
            ex.allHistoricalAlarms += (ex.allHistoricalAlarms ? " | " : "") + `[${leadObj.alarmDate}] ${leadObj.alarmNotes}`;
          }
        } else {
          byNormStreet[key] = leadObj;
        }
      });

      allLeads = Object.values(byNormStreet);
      localStorage.setItem("firetrackr_leads_v3", JSON.stringify(allLeads));
      recomputeUnmatchedPortalList();
      applyFilters();
      updateExportButtons();

      document.getElementById("map-status-banner").innerText =
        `✅ Loaded ${allLeads.length} Leads | Matched ${matchedPortalCount} Portal Properties (${updatedInspDatesCount} Inspection Dates Updated) | ${unmatchedPortalList.length} Net-New Portal Violations Ready to Screen`;
    }
  });
}

function recomputeUnmatchedPortalList() {
  const masterNormSet = new Set(allLeads.map(l => l.normStreet).filter(Boolean));
  unmatchedPortalList = [];
  for (const [ns, pObj] of Object.entries(PORTAL_DEFICIENCY_DB)) {
    if (!masterNormSet.has(ns)) {
      unmatchedPortalList.push({ normStreet: ns, ...pObj });
    }
  }
  const cntEl = document.getElementById("unmatched-count");
  if (cntEl) cntEl.innerText = unmatchedPortalList.length;
}

function updateExportButtons() {
  const show = allLeads.length > 0;

function triggerCSVDownload(csvContent, fileName) {
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });

  a.download = fileName;
  a.click();
}

// ============================================================================
// 7. FILTER ENGINE, TOGGLE SWITCHES, MAP PINS & CLOSEST LEADS LIST
// ============================================================================
function updateRadiusLabel() {
  const v = document.getElementById("radius-slider").value;
  document.getElementById("radius-label").innerText = v + " mi";
}

function toggleFilter(key) {
  activeFilters[key] = !activeFilters[key];
  const el = document.getElementById("toggle-" + key);
  const classMap = {
    rytag: "active-rytag",
    alarm: "active-alarm",
    insp: "active-insp",
    defic: "active-defic"
  };
  el.classList.toggle(classMap[key], activeFilters[key]);
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById("search-input").value || "").toLowerCase().trim();
  const maxRadius = parseFloat(document.getElementById("radius-slider").value || "50");

  let cntRY = 0, cntAlarm = 0, cntInsp = 0, cntDefic = 0;

  allLeads.forEach(l => {
    l.distanceMiles = haversineMiles(userLat, userLng, l.lat, l.lng);
    l.flags = evaluateLeadFlags(l);
    if (l.flags.hasActiveRYTag) cntRY++;
    if (l.flags.hasAlarm30d) cntAlarm++;
    if (l.flags.hasInsp60d) cntInsp++;
    if (l.flags.hasDefic45d) cntDefic++;
  });

  document.getElementById("cnt-rytag").innerText = cntRY;
  document.getElementById("cnt-alarm").innerText = cntAlarm;
  document.getElementById("cnt-insp").innerText = cntInsp;
  document.getElementById("cnt-defic").innerText = cntDefic;
  document.getElementById("lead-count-badge").innerText = `${allLeads.length} Leads`;

  const anyToggleActive = activeFilters.rytag || activeFilters.alarm || activeFilters.insp || activeFilters.defic;

  filteredLeads = allLeads.filter(l => {
    if (q) {
      const hay = `${l.businessName} ${l.street} ${l.cityStateZip} ${l.contactName} ${l.currentTagStatus} ${l.deficiencyLog} ${l.notes}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }

    if (anyToggleActive) {
      let matchToggle = false;
      if (activeFilters.rytag && l.flags.hasActiveRYTag) matchToggle = true;
      if (activeFilters.alarm && l.flags.hasAlarm30d) matchToggle = true;
      if (activeFilters.insp && l.flags.hasInsp60d) matchToggle = true;
      if (activeFilters.defic && l.flags.hasDefic45d) matchToggle = true;
      if (!matchToggle) return false;
      // Bypass radius restriction when Alarms or Red/Yellow Tags toggle is active
      if (activeFilters.rytag || activeFilters.alarm) return true;
    }

    return l.distanceMiles <= maxRadius;
  });

  filteredLeads.sort((a, b) => a.distanceMiles - b.distanceMiles);
  renderMapMarkers();
  renderClosestList();
}

function getPinStyle(l) {
  if (l.flags.hasActiveRed) return { cls: "pin-redtag", icon: "🚨", badge: "RED TAG" };
  if (l.flags.hasActiveYellow) return { cls: "pin-yellowtag", icon: "⚠️", badge: "YELLOW TAG" };
  if (l.flags.hasAlarm30d) return { cls: "pin-alarm", icon: "🚒", badge: "ALARM 30D" };
  if (l.flags.hasDefic45d) return { cls: "pin-defic", icon: "🔧", badge: "POST-INSP 45D" };
  if (l.flags.hasInsp60d) return { cls: "pin-insp", icon: "🔥", badge: "INSP DUE 60D" };
  if (l.visited) return { cls: "pin-visited", icon: "✓", badge: "VISITED" };
  return { cls: "pin-default", icon: "🏢", badge: "LEAD" };
}

function renderMapMarkers() {
  markersLayer.clearLayers();
  filteredLeads.slice(0, 600).forEach(l => {
    const st = getPinStyle(l);
    const divIcon = L.divIcon({
      className: "",
      html: `<div class="pin-marker ${st.cls}">${st.icon}</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });
    const m = L.marker([l.lat, l.lng], { icon: divIcon });
    m.on("click", () => openLeadRecord(l.id));
    markersLayer.addLayer(m);
  });
}

function renderClosestList() {
  const container = document.getElementById("closest-list");
  document.getElementById("list-showing-count").innerText = `${filteredLeads.length} matched`;

  if (!filteredLeads.length) {
    container.innerHTML = `<div style="padding:18px;text-align:center;color:#64748b;font-size:0.82rem;">No leads match current filter criteria. Try toggling off filters or importing your Master CSV.</div>`;
    return;
  }

  container.innerHTML = filteredLeads.slice(0, 150).map(l => {
    const st = getPinStyle(l);
    let tagBadgeHtml = "";
    if (l.flags.hasActiveRed) {
      tagBadgeHtml = `<span class="tag-chip red">🚨 RED TAG</span>`;
    } else if (l.flags.hasActiveYellow) {
      tagBadgeHtml = `<span class="tag-chip yellow">⚠️ YELLOW TAG</span>`;
    } else if (l.historicalTagRecord) {
      tagBadgeHtml = `<span class="tag-chip hist">📜 ${l.historicalTagRecord}</span>`;
    }
    const inspLabel = l.inspectionDate ? `Insp: ${l.inspectionDate}` : "Insp: Not Set";
    return `
      <div class="lead-row" onclick="openLeadRecord('${l.id}')">
        <div class="lead-row-left">
          <div class="lead-row-title">
            <span>${st.icon}</span>
            <span>${escapeHtml(l.businessName)}</span>
            ${tagBadgeHtml}
          </div>
          <div class="lead-row-sub">
            ${escapeHtml(l.street)}, ${escapeHtml(l.cityStateZip)} ${l.contactName ? " • 👤 " + escapeHtml(l.contactName) : ""}
          </div>
        </div>
        <div class="lead-row-right">
          <span class="dist-pill">${l.distanceMiles.toFixed(1)} mi</span>
          <span style="font-size:0.68rem;color:#64748b;">${inspLabel}</span>
        </div>
      </div>
    `;
  }).join("");
}

    <div class="prop-header">
      <h2>${escapeHtml(lead.businessName)}</h2>
      <div class="prop-addr">📍 ${escapeHtml(lead.street)}, ${escapeHtml(lead.cityStateZip)} (${lead.distanceMiles.toFixed(1)} mi away)</div>
    </div>

    <div class="quick-actions">
      ${lead.phone ? `<a href="tel:${escapeHtml(lead.phone)}">📞 Call</a>` : `<a href="${googleSearchUrl}" target="_blank">🔍 Web Lookup</a>`}
      ${lead.email ? `<a href="mailto:${escapeHtml(lead.email)}" style="background:#0284c7;">✉️ Email</a>` : ""}
      <a href="${mapsNavUrl}" target="_blank" style="background:#16a34a;">🗺️ Navigate</a>
      <button onclick="toggleVisited('${lead.id}')" style="background:${lead.visited ? '#15803d' : '#475569'};">
        ${lead.visited ? "✅ Visited" : "☑️ Mark Visited"}
      </button>
    </div>

    ${deficiencySectionHTML}

    <div class="contact-card">
      <div><strong>👤 Contact:</strong> ${escapeHtml(lead.contactName || "Not Listed")}</div>
      <div><strong>💼 Title:</strong> ${escapeHtml(lead.jobTitle || "N/A")}</div>
      <div><strong>📞 Phone:</strong> ${escapeHtml(lead.phone || "N/A")}</div>
      <div><strong>📅 Inspection Due (1st):</strong> ${escapeHtml(lead.inspectionDate || "Not Set")}</div>
      <div class="full"><strong>🔎 Date Source:</strong> ${escapeHtml(lead.inspectionSource || "CRM / Default")}</div>
      ${lead.notes ? `<div class="full" style="border-top:1px solid #e2e8f0;padding-top:6px;max-height:95px;overflow-y:auto;"><strong>📝 CRM Timeline Notes:</strong> ${escapeHtml(lead.notes)}</div>` : ""}
    </div>

    ${alarmSectionHTML}

    <div class="section-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin:0;border:none;">🛠️ Field Survey & Tag Documentation</h3>
        <button class="btn slate" onclick="addSurveyBuilding()">+ Add Building</button>
      </div>
      ${surveyCardsHTML}
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn green" style="flex:1;justify-content:center;" onclick="generateSurveyPDF()">📄 Download Survey PDF</button>
        <button class="btn" style="flex:1;justify-content:center;" onclick="emailSurveyReport()">✉️ Email Survey Scope</button>
      </div>
    </div>
  `;

  document.getElementById("record-drawer").classList.add("open");
}

function closeDrawer() {
  document.getElementById("record-drawer").classList.remove("open");
}

function toggleVisited(id) {
  const lead = allLeads.find(x => x.id === id);
  if (!lead) return;
  lead.visited = !lead.visited;
  localStorage.setItem("firetrackr_leads_v3", JSON.stringify(allLeads));
  openLeadRecord(id);
  applyFilters();
}

function updateSurveyField(bIdx, field, val) {
  const lead = allLeads.find(x => x.id === currentLeadId);
  if (!lead || !lead.surveys[bIdx]) return;
  lead.surveys[bIdx][field] = val;
  localStorage.setItem("firetrackr_leads_v3", JSON.stringify(allLeads));
}

function addSurveyBuilding() {
  const lead = allLeads.find(x => x.id === currentLeadId);
  if (!lead) return;
  const nextNum = (lead.surveys ? lead.surveys.length : 0) + 1;
  lead.surveys.push({ name: "Building " + nextNum, panelMake: "", commType: "Unknown", extCount: 0, tagType: "None", notes: "", photos: [] });
  localStorage.setItem("firetrackr_leads_v3", JSON.stringify(allLeads));
  openLeadRecord(currentLeadId);
}

// Cardinal Direction Navigation (⬆️ N, ⬇️ S, ⬅️ W, ➡️ E)
function navigateCardinal(dir) {
  const cur = allLeads.find(x => x.id === currentLeadId);
  if (!cur) return;
  const candidates = filteredLeads.filter(x => {
    if (x.id === cur.id) return false;
    if (dir === "N") return x.lat > cur.lat;
    if (dir === "S") return x.lat < cur.lat;
    if (dir === "E") return x.lng > cur.lng;
    if (dir === "W") return x.lng < cur.lng;
    return false;
  });
  if (!candidates.length) return;
  candidates.sort((a, b) => haversineMiles(cur.lat, cur.lng, a.lat, a.lng) - haversineMiles(cur.lat, cur.lng, b.lat, b.lng));
  openLeadRecord(candidates[0].id);
}

function generateSurveyPDF() {
  const lead = allLeads.find(x => x.id === currentLeadId);
  if (!lead || !window.jspdf) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(`Firetrackr Site Survey & Deficiency Report`, 14, 18);
  doc.setFontSize(10);
  doc.text(`Property: ${lead.businessName}`, 14, 28);
  doc.text(`Address: ${lead.street}, ${lead.cityStateZip}`, 14, 34);
  doc.text(`Contact: ${lead.contactName || "N/A"} | Phone: ${lead.phone || "N/A"}`, 14, 40);
  doc.text(`Inspection Due (1st): ${lead.inspectionDate || "Not Set"} | Tag Status: ${lead.currentTagStatus || "None"}`, 14, 46);
  let y = 56;
  if (lead.deficiencyLog) {
    doc.text(`Municipal Deficiency History:`, 14, y);
    y += 6;
    const lines = doc.splitTextToSize(lead.deficiencyLog, 180);
    doc.text(lines.slice(0, 12), 14, y);
    y += Math.min(lines.length, 12) * 5 + 6;
  }
  (lead.surveys || []).forEach(b => {
    doc.text(`[${b.name}] FACP: ${b.panelMake || "N/A"} | Comm: ${b.commType} | Field Tags: ${b.tagType}`, 14, y);
    y += 6;
    if (b.notes) {
      const nLines = doc.splitTextToSize(`Notes: ${b.notes}`, 180);
      doc.text(nLines, 14, y);
      y += nLines.length * 5 + 4;
    }
  });
  doc.save(`${lead.businessName.replace(/[^a-z0-9]/gi, "_")}_Survey.pdf`);
}

function emailSurveyReport() {
  const lead = allLeads.find(x => x.id === currentLeadId);
  if (!lead) return;
  const subj = encodeURIComponent(`Firetrackr Site Survey - ${lead.businessName}`);
  const bldgText = (lead.surveys || []).map(b =>
    `• ${b.name}: FACP=${b.panelMake || "N/A"} | Comm=${b.commType} | Tags=${b.tagType} | Notes=${b.notes || "None"}`
  ).join("\n");
  const body = encodeURIComponent(
    `PROPERTY DETAILS:\n- Business: ${lead.businessName}\n- Address: ${lead.street}, ${lead.cityStateZip}\n- Contact: ${lead.contactName} (${lead.phone})\n- Inspection Due: ${lead.inspectionDate}\n- Municipal Tag Status: ${lead.currentTagStatus || "None"}\n- Municipal Deficiency Notes: ${lead.deficiencyLog || "None"}\n\nFIELD SURVEY BUILDINGS:\n${bldgText}`
  );
  window.location.href = `mailto:speterson@firetrol.net?subject=${subj}&body=${body}`;
}

function clearAllData() {
  if (!confirm("Clear stored leads from browser memory?")) return;
  localStorage.removeItem("firetrackr_leads_v3");
  allLeads = [];
  filteredLeads = [];
  markersLayer.clearLayers();
  document.getElementById("closest-list").innerHTML = "";
  updateExportButtons();
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>
</body>
</html>
